name: Content review
about: Report a factual, educational, language, or source issue
labels: ["content-review"]
body:
  - type: input
    id: mission
    attributes:
      label: Mission or file
      placeholder: L01-M04 or content/en-US/...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Factual accuracy
        - Educational clarity
        - Risk or compliance
        - Source quality
        - English language
        - Future Arabic localization
        - Visual or diagram
        - Other
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Describe the problem and the proposed correction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence or source
