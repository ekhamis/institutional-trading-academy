name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate academy content
        run: python scripts/validate_project.py

      - name: Package versioned archive
        run: python scripts/package_release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: institutional-trading-academy-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
